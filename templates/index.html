<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的第一個網站</title>
</head>

<body>
    <h1>我的第一個網站</h1>

    <p>這是我用 HTML 做的第一個網頁。</p>

<button onclick="getData()">取得 API 資料</button>

    <script>
    alert("你好！這是 JavaScript！");
        async function getData() {
    const response = await fetch("/api");
    const data = await response.json();
    alert(data.message);
}
    </script>
</body>
</html>
